name: React CI/CD

on:
  push:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: write
  id-token: write

env:
  NODE_VERSION: "22"
  IMAGE_NAME: my-react-app
  REGISTRY: ghcr.io

jobs:

  # ============================================================
  # 1. INSTALL + LINT + TEST
  # ============================================================
  test:
    name: Test React Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit/component tests
        run: npm run test:ci

      - name: Build React application
        run: npm run build

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

      - name: Upload React build
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: dist/


  # ============================================================
  # 2. SONARQUBE CODE QUALITY
  # ============================================================
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm ci

      - name: Run tests with coverage
        run: npm run test:ci

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  # ============================================================
  # 3. TRIVY FILESYSTEM / DEPENDENCY SCAN
  # ============================================================
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1


  # ============================================================
  # 4. BUILD DOCKER IMAGE
  # ============================================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs:
      - test
      - sonarqube
      - trivy-fs

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Build Docker image for Trivy
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .


  # ============================================================
  # 5. TRIVY DOCKER IMAGE SCAN
  # ============================================================
  trivy-image:
    name: Trivy Docker Image Scan
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1


  # ============================================================
  # 6. PUSH IMAGE TO GITHUB CONTAINER REGISTRY
  # ============================================================
  docker-push:
    name: Push Docker Image
    runs-on: ubuntu-latest
    needs:
      - trivy-image

    # Don't push images for pull requests
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate image attestation
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true


  # ============================================================
# 7. DEPLOY TO VPS
# ============================================================
  deploy-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: docker-push

    # Deploy only from main branch and never from pull requests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e

            echo "Connected to VPS"
            whoami
            hostname

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

            IMAGE="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest"

            echo "Pulling image: $IMAGE"
            docker pull "$IMAGE"

            echo "Stopping existing container..."
            docker stop "${{ env.IMAGE_NAME }}" || true

            echo "Removing existing container..."
            docker rm "${{ env.IMAGE_NAME }}" || true

            echo "Starting new container..."
            docker run -d \
              --name "${{ env.IMAGE_NAME }}" \
              --restart unless-stopped \
              -p 9999:80 \
              "$IMAGE"

            echo "Deployment completed successfully"
            docker ps --filter "name=${{ env.IMAGE_NAME }}"
